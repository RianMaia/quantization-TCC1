[project]
name = "quantization-ptbr"
version = "0.1.0"
description = "Experimentos de quantização para modelos em português brasileiro"
requires-python = ">=3.12"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "click==8.4.2",
    "datasets==5.0.1",
    "dill==0.4.1",
    "filelock==3.32.2",
    "frozenlist==1.8.0",
    "fsspec==2026.6.0",
    "grpcio==1.83.0",
    "h11==0.16.0",
    "h2==4.4.1",
    "hf-xet==1.6.0",
    "hpack==4.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "hyperframe==6.1.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "multidict==6.7.1",
    "multiprocess==0.70.19",
    "narwhals==2.24.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "packaging==26.3",
    "pandas==3.0.5",
    "portalocker==3.2.0",
    "propcache==0.5.2",
    "protobuf==7.35.1",
    "pyarrow==25.0.1",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "qdrant-client==1.19.0",
    "regex==2026.7.19",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "sentence-transformers==5.7.0",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "typer==0.27.1",
    "typing-inspection==0.4.4",
    "typing-extensions==4.16.0",
    "urllib3==2.7.0",
    "xxhash==3.8.1",
    "yarl==1.24.5",
    "pytest>=9.1.1",
    "ir-measures>=0.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantptbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requer GPU e o modelo baixado; roda o passe de embedding"]

[tool.ruff]
line-length = 100
